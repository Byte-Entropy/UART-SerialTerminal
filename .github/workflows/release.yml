name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure CMake
        run: cmake -B build

      - name: Build
        run: cmake --build build --config Release

      - name: Prepare Bundle
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path release_bundle -Force
          Copy-Item build\Release\*.exe release_bundle\
          Compress-Archive -Path release_bundle\* -DestinationPath UART_SerialTerminal_Windows.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: UART_SerialTerminal_Windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}